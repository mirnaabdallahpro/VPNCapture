name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:   # permet de lancer a la main depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Pas de gradle wrapper dans le projet : on installe Gradle directement (AGP 8.5 exige >= 8.7)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compiler l'APK debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiniVpnCapture-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
